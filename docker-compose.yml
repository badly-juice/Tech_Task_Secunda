name: payment-service

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  migrate:
    build: .
    command: alembic upgrade head
    environment: &app-env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      API_KEY: change-me-super-secret-key
      LOG_JSON: "true"
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    environment: *app-env
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  consumer:
    build: .
    command: python -m src.worker.consumer
    environment: *app-env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  outbox_worker:
    build: .
    command: python -m src.worker.outbox_worker
    environment: *app-env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  webhook_receiver:
    image: python:3.14-slim
    profiles: ["demo"]
    command: python -u /app/webhook_receiver.py
    volumes:
      - ./tools/webhook_receiver.py:/app/webhook_receiver.py:ro
    ports:
      - "8001:8000"

volumes:
  postgres_data:
